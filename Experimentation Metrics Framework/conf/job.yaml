spark:
  app_name: "experiment-metrics-framework"
  master: "spark://spark-master:7077"

inputs:
  exposures_path: "/opt/app/data/input/exposures.parquet"
  outcomes_path: "/opt/app/data/input/outcomes.parquet"

experiment:
  experiment_id: "exp_123"
  analysis_start_ts: "2026-01-01T00:00:00Z"
  analysis_end_ts: "2026-01-15T00:00:00Z"
  attribution: "first_exposure"  # first_exposure | last_exposure

cuped:
  enabled: true
  pre_period_hours: 168  # 7d pre-period
  metric_for_covariate: "plays"  # event_type to use as covariate

outputs:
  out_dir: "/opt/app/data/output/exp_123"
  mode: "overwrite"

metrics_file: "/opt/app/conf/metrics.yaml"
