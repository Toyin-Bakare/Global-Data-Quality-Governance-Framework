name: daily_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint

validations:
  - batch_request:
      datasource_name: pg_dq
      data_connector_name: default_runtime_data_connector_name
      data_asset_name: customer_orders
      runtime_parameters:
        query: "SELECT order_id, customer_id, order_amount, ingestion_ts FROM customer_orders"
      batch_identifiers:
        default_identifier_name: default_id
    expectation_suite_name: customer_orders_suite
