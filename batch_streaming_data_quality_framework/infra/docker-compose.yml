version: "3.8"
name: dq_framework

services:
  postgres:
    image: postgres:16
    container_name: dq_postgres
    environment:
      POSTGRES_USER: dq
      POSTGRES_PASSWORD: dq
      POSTGRES_DB: dq
    ports:
      - "5432:5432"
    volumes:
      - dq_pgdata:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: dq_zk
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dq_kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  airflow:
    build:
      context: ..
      dockerfile: infra/Dockerfile.airflow
    container_name: dq_airflow
    env_file: [infra/airflow.env]
    ports:
      - "8081:8080"
    depends_on: [postgres]

  spark:
    build:
      context: ..
      dockerfile: infra/Dockerfile.spark
    container_name: dq_spark
    environment:
      DQ_DB_URL: "postgresql://dq:dq@postgres:5432/dq"
      KAFKA_BOOTSTRAP: "kafka:9092"
      TOPIC_ORDERS: "events.orders"
      DASHBOARD_URL: "http://localhost:8091"
    depends_on: [kafka, postgres]

  dashboard:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dashboard
    container_name: dq_dashboard
    environment:
      DQ_DB_URL: "postgresql://dq:dq@postgres:5432/dq"
    ports:
      - "8091:8091"
    depends_on: [postgres]

volumes:
  dq_pgdata: {}
